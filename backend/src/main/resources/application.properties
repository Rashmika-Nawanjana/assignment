spring.application.name=sun-travels

# MySQL — prefer: docker compose up -d  (see database/README.md)
# Or local MySQL after database/init.sql
# Host port 3307 matches docker-compose "3307:3306" (container still listens on 3306)
spring.datasource.url=jdbc:mysql://localhost:3307/suntravels?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=suntravels
spring.datasource.password=suntravels

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT (keep secret long; change in real production)
app.jwt.secret=SunTravelsSecretKeyForJwtSigningMustBeLongEnough123456
app.jwt.expiration-ms=86400000

# Dummy seed data (runs once on startup; set false to skip)
app.seed.latency-data=true
app.seed.latency-hotels=50
app.seed.latency-bookings=400
app.seed.latency-agents=20
