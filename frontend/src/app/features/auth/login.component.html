<section class="auth-page">
  <div class="auth-card">
    <p class="eyebrow">Sun Travels ERP</p>
    <h1>Sign in</h1>
    <p class="lede">Agents search rooms. Managers edit contracts. Admins manage users.</p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <label>
        Username
        <input name="username" [(ngModel)]="username" required [disabled]="loading()" />
      </label>
      <label>
        Password
        <input
          name="password"
          type="password"
          [(ngModel)]="password"
          required
          [disabled]="loading()"
        />
      </label>

      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="switch">
      New here?
      <a routerLink="/signup">Create an agent account</a>
    </p>

    <div class="demo">
      <p>Demo logins</p>
      <code>admin / Admin&#64;12345</code>
      <code>manager / Manager&#64;12345</code>
      <code>agent / Agent&#64;12345</code>
    </div>
  </div>
</section>
