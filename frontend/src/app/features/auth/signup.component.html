<section class="auth-page">
  <div class="auth-card">
    <p class="eyebrow">Sun Travels ERP</p>
    <h1>Create account</h1>
    <p class="lede">Self-signup creates an <strong>AGENT</strong> account for room search.</p>

    <form (ngSubmit)="onSubmit()" #form="ngForm">
      <label>
        Full name
        <input name="fullName" [(ngModel)]="fullName" required [disabled]="loading()" />
      </label>
      <label>
        Username
        <input name="username" [(ngModel)]="username" required minlength="3" [disabled]="loading()" />
      </label>
      <label>
        Email
        <input name="email" type="email" [(ngModel)]="email" [disabled]="loading()" />
      </label>
      <label>
        Password
        <input
          name="password"
          type="password"
          [(ngModel)]="password"
          required
          [disabled]="loading()"
        />
      </label>
      <label>
        Confirm password
        <input
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          required
          [disabled]="loading()"
        />
      </label>

      <p class="lede" style="margin: 0; font-size: 0.82rem">{{ hint }}</p>

      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating…' : 'Sign up' }}
      </button>
    </form>

    <p class="switch">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>
  </div>
</section>
